<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Challenge</title>
    <script>
      // SPA fallback for GitHub Pages: rewrite the path into a query string
      // that index.html will decode and replace into history on load.
      // Based on https://github.com/rafgraph/spa-github-pages (MIT).
      (function () {
        var segmentCount = 1; // /code-challenge/ -> keep one segment
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + segmentCount)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(segmentCount)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
